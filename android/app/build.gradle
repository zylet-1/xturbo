plugins {
    id 'com.android.application'
}

android {
    namespace 'org.scratchmod.editor'
    compileSdk 35

    defaultConfig {
        applicationId 'org.scratchmod.editor'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

tasks.register('copyScratchEditor', Copy) {
    from(rootProject.file('../build')) {
        include 'index.html', 'gui.js', '*.hex', 'chunks/**', 'static/**'
        exclude '**/*.map', '**/*.LICENSE.txt'
    }
    into(layout.projectDirectory.dir('src/main/assets/www'))
    doFirst {
        project.delete(destinationDir)
    }
}

tasks.named('preBuild').configure {
    dependsOn('copyScratchEditor')
}
